name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Home Assistant 2026.8 requires Python >= 3.14.2. Pinning 3.13 here made the pytest
  # job unable to resolve the test harness at all.
  DEFAULT_PYTHON: "3.14"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - run: python -m pip install --upgrade pip && pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  types:
    name: mypy --strict on protocol/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - run: python -m pip install --upgrade pip && pip install mypy
      # AGENTS.md §4: the protocol package is pure standard library, so strict mode is enforceable
      # there without installing Home Assistant. Scope and exclusions live in pyproject.toml.
      - name: mypy
        run: mypy

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements_test.txt
      # `pytest tests` is required, not cosmetic: the repository root is itself a Python package
      # (the old jfl_active integration) and must never become pytest's rootdir. See tests/pytest.ini.
      # Coverage settings come from pyproject.toml, which `coverage` discovers from the working
      # directory — the repository root — even though pytest's rootdir is tests/.
      - name: pytest
        run: pytest tests --cov --cov-report=term-missing --cov-fail-under=90
