name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Home Assistant 2026.8 requires Python >= 3.14.2. Pinning 3.13 here made the pytest
  # job unable to resolve the test harness at all.
  DEFAULT_PYTHON: "3.14"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      # The pinned version, not the latest. `requirements_test.txt` holds `ruff==0.14.*`, and
      # `ruff format` changes its output between minor releases — an unpinned install meant CI
      # formatted to a newer ruff than any developer had, so `ruff format --check` failed on code
      # the local formatter considered clean. `ruff check` passed throughout, which made it look
      # like a formatting bug in the code rather than a version skew.
      - run: python -m pip install --upgrade pip && pip install -r requirements_test.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  types:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
      # The full test requirements, not just mypy. `files` in pyproject.toml is the integration, and
      # every module of it imports Home Assistant — without the harness installed, mypy reports 181
      # `import-not-found` errors that say nothing about this code. It used to be scoped to
      # `protocol/`, which was pure standard library and needed no dependencies; that package is
      # `pyjfl` now (ADR-0019) and is type-checked in its own repository.
      - run: python -m pip install --upgrade pip && pip install -r requirements_test.txt
      - name: mypy
        run: mypy

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements_test.txt
      # `pytest tests` is required, not cosmetic: the repository root is itself a Python package
      # (the old jfl_active integration) and must never become pytest's rootdir. See tests/pytest.ini.
      #
      # **No `--cov-fail-under` here, deliberately.** Coverage is measured over
      # `custom_components/jfl_alarm`, and the tests that exercise it — `tests/integration/` — are
      # not part of the published snapshot: they belong to the private repository, where the full
      # suite runs against a real Home Assistant. Asserting a threshold against a tree that ships
      # only the repository-hygiene tests measures nothing and fails at 0%. The number that matters
      # is enforced where the whole suite exists.
      # `-p no:randomly -v` is not decoration: this job failed for three releases with nothing but
      # "exit code 2" in the annotation and a six-second runtime, while the identical command passed
      # locally in a venv built from the same requirements and the same Python. Exit 2 is a
      # collection error, so the traceback exists — it was simply never surfaced, and the log needs
      # a token to read. `-v` names the file it dies on, and `--tb=short` prints why.
      - name: pytest
        run: pytest tests --cov --cov-report=term-missing -v --tb=short
