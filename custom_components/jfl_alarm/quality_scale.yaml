# Home Assistant integration quality scale.
#
# Target: **Gold**. This file is the honest self-assessment, not an aspiration — anything not done is
# marked `todo` with what is missing, and every `exempt` says why in a sentence a reviewer can check.
#
# The exemptions almost all come from one fact: **the panel dials out to us**. There is nothing to
# discover, nothing to poll, no session to re-authenticate and no HTTP client to inject.
#
# **`manifest.json` still declares `bronze`, and that is not an oversight.** Every Bronze, Silver,
# Gold and Platinum rule below is now `done` or `exempt` except one: `brands`. The artwork exists
# and ships with the integration, but the rule is phrased around the home-assistant/brands
# repository, which no longer accepts custom integrations — so nobody has confirmed the inline
# mechanism satisfies it. Claiming a tier this integration has not earned would be the one kind of
# dishonesty this project's rules single out. Raise it when a reviewer answers that question.
#
# `async-dependency` is `done` on firmer ground since 2026-08-12: the asyncio implementation is
# `pyjfl` on PyPI, an external library the manifest requires by exact version, which is what the
# Platinum rule actually asks for. ADR-0019 records the extraction.

rules:
  # --- Bronze ---------------------------------------------------------------------------------
  action-setup:
    status: done
    comment: Registered in `async_setup`, so automations validate while the entry is unloaded.
  appropriate-polling:
    status: exempt
    comment: >
      Home Assistant never polls this integration — `update_interval` is `None` and the listener
      pushes. The panel *is* polled for status, but on the connection's own task, because only that
      task knows whether there is a socket to poll over. The interval is a user option.
  brands:
    status: todo
    comment: >-
      The images exist and users see them: JFL's own logo, used with the manufacturer's written
      authorisation, shipped at custom_components/jfl_alarm/brand/ and served by the local brands
      proxy (Home Assistant 2026.3+). Verified loading on 2026.8.1.

      Left `todo` deliberately rather than claimed. The rule was written for artwork in the
      home-assistant/brands repository, and that repository now auto-closes pull requests for
      custom_integrations/* — so there is no submission to make while this is a custom integration,
      and no reviewer has confirmed the inline mechanism satisfies the rule as written. It becomes
      answerable, and a real submission again, if this is accepted into core:
      core_integrations/jfl_alarm/. See docs/development/brand-assets.md.
  common-modules:
    status: done
  config-flow:
    status: done
    comment: One question — the port — because everything else is read from the panel.
  config-flow-test-coverage:
    status: done
    comment: 100% on `config_flow.py`.
  dependency-transparency:
    status: done
    comment: >
      No third-party requirements at all — the whole protocol is standard library. It is
      implemented in-tree today and is published as `pyjfl`, generated from `protocol/` and
      `server.py` by `scripts/publish.py lib`; a core submission declares that package in
      `requirements`. See ADR-0019.
  docs-actions:
    status: done
  docs-conditions:
    status: exempt
    comment: >
      The integration registers no conditions. Everything a condition would test is already
      entity state — a partition's `alarm_control_panel` state, a zone's `binary_sensor`, the
      fence's `switch` — so the built-in state condition answers it.
  docs-high-level-description:
    status: done
  docs-installation-instructions:
    status: done
  docs-triggers:
    status: exempt
    comment: >
      The integration registers no triggers. Panel events arrive as `event` entities, which the
      built-in `state` and `event` triggers already fire on, and a bespoke trigger would be a
      second way to say the same thing.
  docs-removal-instructions:
    status: done
    comment: >
      Both manuals, including the part everybody forgets: the panel keeps dialling out to that
      address until somebody clears the reporting destination, and if it was pointed at the
      monitoring company's slot, theirs has to go back.
  entity-event-setup:
    status: done
    comment: Dispatcher subscriptions in `async_added_to_hass`, removed via `async_on_remove`.
  entity-unique-id:
    status: done
    comment: Derived from the **panel serial**, never from `entry_id`, so it survives a re-add.
  has-entity-name:
    status: done
  runtime-data:
    status: done
  test-before-configure:
    status: done
    comment: The config flow binds the port to prove nothing else holds it.
  test-before-setup:
    status: done
    comment: >
      `ConfigEntryNotReady` when the port cannot be bound. Deliberately *not* raised for "no panel
      has connected" — a panel that has not dialled in yet is the normal state for the first minute,
      and failing setup for it would produce a retry loop instead of an integration.
  unique-config-entry:
    status: done
    comment: The port is the entry's unique id; two listeners on one port cannot work.

  # --- Silver ---------------------------------------------------------------------------------
  action-exceptions:
    status: done
    comment: Every failure raises `ServiceValidationError` or `HomeAssistantError` with a
      translation key. Nothing fails silently.
  config-entry-unloading:
    status: done
    comment: >
      Platforms unload, then the listener stops. The order matters: closing the server before its
      connections deadlocks `wait_closed`, and the port is never freed. A test covers it.
  docs-configuration-parameters:
    status: done
  docs-installation-parameters:
    status: done
  entity-unavailable:
    status: done
    comment: >
      Availability follows the panel's connection, not `last_update_success`. The connectivity
      sensor, the two liveness timestamps, the refresh button and the commands switch stay available
      on purpose — they are precisely what you want when the panel is away.
  integration-owner:
    status: done
  log-when-unavailable:
    status: done
    comment: Once per transition, never per retry. AGENTS.md §4.
  parallel-updates:
    status: done
    comment: 0 on the read-only platforms, 1 on `alarm_control_panel` and `switch`.
  reauthentication-flow:
    status: exempt
    comment: >
      There are no credentials. The panel authenticates itself by serial in its connection frame,
      and no command this integration sends carries a password — see
      `docs/adr/0004-no-authenticated-command-path.md`.
  test-coverage:
    status: done
    comment: 96% overall, well past the 95% the rule asks for.

  # --- Gold -----------------------------------------------------------------------------------
  devices:
    status: done
    comment: One device per panel, with a sub-device per partition and one for the fence.
  diagnostics:
    status: done
    comment: >
      Config-entry and per-device, with the last fifty raw frames. Identifiers are redacted by a
      stable hash rather than blanked, so a three-panel dump stays readable.
  discovery:
    status: exempt
    comment: >
      Nothing to discover on the network — the panel connects to us. A panel that dials in without a
      subentry is offered in the add-panel flow, which is the same idea reached from the other end.
  discovery-update-info:
    status: exempt
    comment: Same reason. A panel that changes IP simply reconnects; it is keyed by serial, not by
      address.
  docs-data-update:
    status: done
  docs-examples:
    status: done
  docs-known-limitations:
    status: done
    comment: The untested models, and the Active 8W's different protocol generation.
  docs-supported-devices:
    status: done
  docs-supported-functions:
    status: done
  docs-troubleshooting:
    status: done
  docs-use-cases:
    status: done
  dynamic-devices:
    status: done
    comment: >
      Discovery re-runs on every coordinator update, so a partition or zone programmed later
      appears without a reload. This is not optional here: at setup time the panel has usually not
      connected, so a platform that enumerates once produces an empty integration.
  entity-category:
    status: done
  entity-device-class:
    status: done
  entity-disabled-by-default:
    status: done
    comment: >
      Twenty-eight of the thirty-two trouble flags, the signal sensor, the panel clock, the
      programming checksum — and the PGM that drives the electric fence, which is a hazard rather
      than clutter.
  entity-translations:
    status: done
    comment: en + pt-BR, with parity enforced by a test.
  exception-translations:
    status: done
  icon-translations:
    status: done
    comment: "`icons.json`; no `_attr_icon` anywhere."
  reconfiguration-flow:
    status: done
    comment: Both the listener and each panel.
  repair-issues:
    status: done
    comment: >
      "No panel has connected", "this model is untested", and the password lockout — the first is
      the integration's most common support question and the third should never fire.
  stale-devices:
    status: done
    comment: >
      `async_remove_config_entry_device` allows deleting a panel that no longer has a subentry.

  # --- Platinum -------------------------------------------------------------------------------
  async-dependency:
    status: done
    comment: >
      Pure asyncio. In-tree today; published as `pyjfl` (ADR-0019), which is asynchronous by
      construction because it is this same code.
  inject-websession:
    status: exempt
    comment: No HTTP anywhere. This is a raw TCP listener.
  strict-typing:
    status: done
    comment: >
      `mypy --strict` runs over the whole integration, all 26 modules, with `warn_unreachable` and
      `ignore-without-code` on top. `pyproject.toml` enforces it. There is exactly one
      `type: ignore` in the package — `services.py`'s optional import of `raw_command`, which is
      absent by design on the core publication track (ADR-0019).
